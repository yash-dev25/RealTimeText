<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>YashCreationWorld
    </title>
</head>
<body>
    <div class="container">
        <h1> Real-time Text Display</h1>
        
        <div class="input-section">
            <label for="textInput">Type something here:</label>
            <input type="text" id="textInput" placeholder="Start typing to see the magic happen... (Press Enter to stop)">
            <div class="controls">
                <div class="char-counter">
                    Characters: <span id="charCount">0</span>
                </div>
                <button id="startRewritingBtn" class="start-rewriting-btn">Start Rewriting</button>
            </div>
            <div class="status-indicator status-active" id="statusIndicator">
                ✏️ Typing Active
            </div>
        </div>
        
        <div class="output-section">
            <div class="output-label">Live Output:</div>
            <p id="outputText" class="placeholder">Your text will appear here as you type...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
